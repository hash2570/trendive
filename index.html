<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrenDive - 실시간 크로스 플랫폼 트렌드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl font-black bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">TrenDive</span>
        <span class="text-xs px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 font-medium">LIVE</span>
      </div>
      <div id="updatedAt" class="text-xs text-slate-400 flex items-center gap-1">
        <i class="fa-solid fa-arrows-rotate animate-spin"></i> 데이터 불러오는 중...
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-8 space-y-10">

    <!-- Hero Section -->
    <section class="bg-gradient-to-r from-blue-900/40 via-slate-900 to-slate-900 p-6 md:p-8 rounded-2xl border border-blue-500/20 relative overflow-hidden">
      <div class="relative z-10">
        <span class="text-xs font-semibold tracking-wider text-cyan-400 uppercase">Current Top Keyword</span>
        <h1 id="topKeyword" class="text-3xl md:text-5xl font-extrabold text-white mt-2 mb-3">
          <span class="animate-pulse text-slate-500">분석 중...</span>
        </h1>
        <p class="text-slate-400 text-sm max-w-xl">
          Naver DataLab 트렌드 분석 지표와 YouTube Shorts 최신 연관 콘텐츠를 결합한 실시간 트렌드 리더보드입니다.
        </p>
      </div>
    </section>

    <!-- Leaderboard Tabs & Content -->
    <section>
      <!-- Navigation Tabs -->
      <div class="flex border-b border-slate-800 mb-6">
        <button id="tabRisingBtn" onclick="switchTab('rising')" class="px-6 py-3 font-bold text-sm border-b-2 border-cyan-400 text-cyan-400 flex items-center gap-2 transition">
          <i class="fa-solid fa-fire text-red-400"></i> 급상승 TOP 10
        </button>
        <button id="tabOverallBtn" onclick="switchTab('overall')" class="px-6 py-3 font-bold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 transition">
          <i class="fa-solid fa-trophy text-amber-400"></i> 전체 인기 TOP 10
        </button>
      </div>

      <!-- Rank List Container -->
      <div id="rankList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- JS Dynamic Injection -->
      </div>
    </section>

    <!-- YouTube Shorts Section -->
    <section class="space-y-4 pt-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fa-brands fa-youtube text-red-500"></i> 관련 인기 숏츠
        </h2>
        <span class="text-xs text-slate-400">실시간 연관 영상</span>
      </div>

      <div id="youtubeGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
        <!-- JS Dynamic Injection -->
      </div>
    </section>

  </main>

  <script>
    let globalData = null;

    // 상태 라벨 배지 렌더링
    function getStatusBadge(status, growthRate) {
      switch (status) {
        case "급상승":
          return `<span class="px-2 py-0.5 text-xs font-bold rounded bg-red-500/10 text-red-400 border border-red-500/20"><i class="fa-solid fa-angles-up"></i> 급상승 (+${growthRate}%)</span>`;
        case "상승":
          return `<span class="px-2 py-0.5 text-xs font-bold rounded bg-amber-500/10 text-amber-400 border border-amber-500/20"><i class="fa-solid fa-arrow-up text-[10px]"></i> 상승 (+${growthRate}%)</span>`;
        case "하락":
          return `<span class="px-2 py-0.5 text-xs font-bold rounded bg-blue-500/10 text-blue-400 border border-blue-500/20"><i class="fa-solid fa-arrow-down text-[10px]"></i> 하락 (${growthRate}%)</span>`;
        default:
          return `<span class="px-2 py-0.5 text-xs font-bold rounded bg-slate-800 text-slate-400 border border-slate-700"><i class="fa-solid fa-minus text-[10px]"></i> 유지</span>`;
      }
    }

    // 랭킹 카드 렌더링
    function renderRankList(items, type) {
      const container = document.getElementById('rankList');
      if (!items || items.length === 0) {
        container.innerHTML = `<div class="col-span-2 text-center py-12 text-slate-500">데이터가 없습니다.</div>`;
        return;
      }

      container.innerHTML = items.map((item) => `
        <div class="bg-slate-900/60 border border-slate-800 hover:border-slate-700 p-4 rounded-xl flex items-center justify-between transition">
          <div class="flex items-center gap-4">
            <span class="text-xl font-black w-6 text-center ${item.rank <= 3 ? 'text-cyan-400' : 'text-slate-500'}">${item.rank}</span>
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-white hover:text-cyan-300 transition cursor-pointer">${item.keyword}</span>
                <span class="text-[11px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">${item.category}</span>
              </div>
              <div class="text-xs text-slate-400 mt-1">
                최근 7일 지수: <span class="text-slate-200 font-semibold">${item.recent7d}</span> | 30일 평균: <span class="text-slate-200 font-semibold">${item.average30d}</span>
              </div>
            </div>
          </div>
          <div class="flex flex-col items-end gap-1">
            ${getStatusBadge(item.status, item.growthRate)}
            <span class="text-[11px] text-slate-500">점수: ${type === 'rising' ? item.risingScore : item.overallScore}</span>
          </div>
        </div>
      `).join('');
    }

    // 탭 전환
    function switchTab(type) {
      const risingBtn = document.getElementById('tabRisingBtn');
      const overallBtn = document.getElementById('tabOverallBtn');

      if (type === 'rising') {
        risingBtn.className = "px-6 py-3 font-bold text-sm border-b-2 border-cyan-400 text-cyan-400 flex items-center gap-2 transition";
        overallBtn.className = "px-6 py-3 font-bold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 transition";
        if (globalData) renderRankList(globalData.risingTop10, 'rising');
      } else {
        overallBtn.className = "px-6 py-3 font-bold text-sm border-b-2 border-cyan-400 text-cyan-400 flex items-center gap-2 transition";
        risingBtn.className = "px-6 py-3 font-bold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center gap-2 transition";
        if (globalData) renderRankList(globalData.overallTop10, 'overall');
      }
    }

    // 유튜브 숏츠 렌더링
    function renderYouTubeShorts(shorts) {
      const container = document.getElementById('youtubeGrid');
      if (!shorts || shorts.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500">관련 숏츠 영상이 없습니다.</div>`;
        return;
      }

      container.innerHTML = shorts.map(item => `
        <a href="https://www.youtube.com/watch?v=${item.videoId}" target="_blank" class="group bg-slate-900 border border-slate-800 rounded-xl overflow-hidden hover:border-slate-700 transition">
          <div class="aspect-[9/16] relative bg-slate-800">
            <img src="${item.thumbnail}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
            <div class="absolute bottom-2 left-2 right-2">
              <p class="text-xs font-medium text-white line-clamp-2 leading-snug">${item.title}</p>
              <p class="text-[10px] text-slate-400 mt-1 truncate">${item.channel}</p>
            </div>
          </div>
        </a>
      `).join('');
    }

    // API 통신 및 초동 데이터 로드
    async function fetchTrendData() {
      try {
        const res = await fetch('/api/trends');
        if (!res.ok) throw new Error("API response error");

        const data = await res.json();
        globalData = data;

        // UI 반영
        document.getElementById('topKeyword').textContent = `# ${data.topKeyword}`;
        document.getElementById('updatedAt').innerHTML = `<i class="fa-regular fa-clock"></i> 업데이트: ${new Date(data.updatedAt).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })}`;

        renderRankList(data.risingTop10, 'rising');
        renderYouTubeShorts(data.youtubeShorts);

      } catch (e) {
        console.error("Data fetch failed:", e);
        document.getElementById('updatedAt').textContent = "데이터로드 실패";
      }
    }

    fetchTrendData();
  </script>
</body>
</html>
